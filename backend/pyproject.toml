[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — AJ Hannon's personal voice-first operator (backend)"
authors = [
    { name = "AJ Hannon", email = "alexanderhannon@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "av>=18.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pywebpush>=2.5.0",
    "recurring-ical-events>=3.8.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the real local STT model", "live: requires real provider credentials (never run by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B008", "B905"]   # B008: FastAPI Depends()/File() defaults are the framework idiom
