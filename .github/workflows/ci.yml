# JARVIS CI: tests + supply-chain and security gates (V5 M0). Runs on every PR and on main.
# No secrets are used: provider calls go to labeled contract fakes, so nothing here spends money or touches AJ's data.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests (real-STT tests excluded)
        run: uv run pytest -q -m "not slow and not live"
      - name: Prompt-injection suite
        run: uv run pytest -q -m injection

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v6
      - name: Dependency vulnerabilities (pip-audit, locked versions)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - name: Static analysis (bandit, medium+)
        working-directory: backend
        # Reviewed false positives carry an inline `# nosec <id> <reason>`; anything new fails the build.
        run: uvx bandit -q -r src -ll
      - name: Static analysis (semgrep)
        run: uvx semgrep scan --config p/python --config p/react --config p/secrets --error --metrics off --quiet
      - name: Secret scan (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
      - name: SBOM (CycloneDX)
        run: |
          # From the locked requirements exported above (this job doesn't install the project).
          uvx --from cyclonedx-bom cyclonedx-py requirements /tmp/requirements.txt --of JSON -o sbom-backend.cdx.json
          (cd frontend && npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --omit dev --output-file ../sbom-frontend.cdx.json)
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Typecheck + build
        run: npx tsc --noEmit && npm run build
      - name: UI tests (mocked API)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
